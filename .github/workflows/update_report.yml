name: Update PCAC Comments Report

on:
  schedule:
    - cron: '0 13 * * *'  # 8am ET daily
  workflow_dispatch:       # also allows manual trigger from GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Remove old cache so we re-fetch fresh comments
        run: rm -f comments_cache.json categorized_cache.json

      - name: Run report generator
        env:
          REGULATIONS_GOV_API_KEY: ${{ secrets.REGULATIONS_GOV_API_KEY }}
        run: python3 regulations_comments.py

      - name: Copy report to index.html
        run: cp comments_report.html index.html

      - name: Commit and push updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html comments_report.html
          git diff --staged --quiet || git commit -m "Auto-update comments report $(date +'%Y-%m-%d')"
          git push
